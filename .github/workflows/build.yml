# crw 镜像构建 workflow(drzfan/crw fork)
# 留档副本:与 push 到 fork 的 .github/workflows/build.yml 内容一致
# 构建参数对齐 VPS 本地构建:
#   docker build --build-arg CARGO_PKGS="-p crw-server --features cdp,impersonated" -t crw:local .
name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag pushed to ghcr.io/drzfan/crw'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # push tag v1.2.3 -> image tag 1.2.3
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="${{ inputs.tag || 'latest' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/drzfan/crw:${{ steps.tag.outputs.tag }}
          build-args: |
            CARGO_PKGS=-p crw-server --features cdp,impersonated
          # Dockerfile 注释指定的 CI 缓存方式:cacher 层(外部依赖)走 gha mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Paseo agent
        if: always()
        run: |
          set -x
          RESP="$(curl -sS -m 30 -w '\nHTTP_STATUS:%{http_code}\n' -X POST \
            -H "Authorization: Bearer ${{ secrets.PASEO_HOOK_TOKEN }}" \
            -H "X-Hook-Source: github-actions" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                --arg repo "${{ github.repository }}" \
                --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --arg image "ghcr.io/drzfan/crw:${{ steps.tag.outputs.tag }}" \
                --arg image_tag "${{ steps.tag.outputs.tag }}" \
                --arg conclusion "${{ job.status }}" \
                '{repo:$repo, run_id:${{ github.run_id }}, run_url:$run_url, image:$image, image_tag:$image_tag, conclusion:$conclusion}')" \
            "https://hook.zhtek.org/hook/${{ secrets.PASEO_AGENT_ID }}")" || true
          echo "===== notify response ====="
          echo "${RESP}"
